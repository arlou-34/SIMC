<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
<style>
body {
    font-family: "Poppins", sans-serif;

    /* Background image with overlay */
    background: 
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), /* dark overlay */
        url("{% static 'images/bg1.jpg' %}") no-repeat center center;
    
    background-size: cover;   /* cover entire viewport */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    
}

/* Login card styling */
.login-card {
    background: white;
    border-radius: 15px;
    padding: 30px 25px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
}

.login-card h3 {
    font-weight: 700;
    margin-bottom: 25px;
    color: #1e3a8a;
    text-align: center;
}

.login-card label {
    font-weight: 500;
    color: #374151;
}

.login-card input {
    border-radius: 8px;
    padding: 10px;
    font-size: 0.95rem;
}

.btn-login {
    background: #2563eb;
    border: none;
    font-weight: 600;
    transition: background 0.3s ease;
}

.btn-login:hover {
    background: #1e40af;
}

/* Responsive adjustments */
@media (max-width: 576px) {
    .login-card {
        padding: 25px 15px;
        width: 100%;
    }
}

@media (max-width: 400px) {
    body {
        padding: 15px;
    }
    .login-card {
        padding: 20px 15px;
    }
}
</style>


</head>

<body>

<div class="login-card">
    <h3>Login</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="mb-3">
           
            {{ form.username}}
        </div>

        <div class="mb-3">
            
            {{ form.password}}
        </div>

        <button type="submit" class="btn btn-login w-100">Login</button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
