<!DOCTYPE html>
<html>
<head>
    
    <title>Edit Vehicular Record</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 700px;
            margin: 50px auto;
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .form-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .others-input {
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title">Edit Vehicular Record</h2>
        <form method="post">
            {% csrf_token %}

            <!-- Age -->
            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" name="age" value="{{ record.age }}" required>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender" required>
                    <option value="Male" {% if record.gender == "Male" %}selected{% endif %}>Male</option>
                    <option value="Female" {% if record.gender == "Female" %}selected{% endif %}>Female</option>
                </select>
            </div>

            <!-- Vehicle Type -->
            <div class="mb-3">
                <label class="form-label">Vehicle Type</label>
                <select class="form-select" id="vehicle_type" name="vehicle_type" required>
                    <option value="SINGLE MOTOR" {% if record.vehicle_type == "SINGLE MOTOR" %}selected{% endif %}>Single Motor</option>
                    <option value="TRICYCLE" {% if record.vehicle_type == "TRICYCLE" %}selected{% endif %}>Tricycle</option>
                    <option value="CAR" {% if record.vehicle_type == "CAR" %}selected{% endif %}>Car</option>
                    <option value="TRUCK" {% if record.vehicle_type == "TRUCK" %}selected{% endif %}>Truck</option>
                    <option value="JEEP" {% if record.vehicle_type == "JEEP" %}selected{% endif %}>Jeep</option>
                    <option value="OTHERS" {% if record.vehicle_type == "OTHERS" %}selected{% endif %}>OTHERS</option>
                </select>
                <input type="text" class="form-control others-input" id="v_others" name="v_others" value="{{ record.v_others }}" placeholder="Specify other vehicle">
            </div>

            <!-- Patient Type -->
            <div class="mb-3">
                <label class="form-label">Patient Type</label>
                <select class="form-select" id="patient_type" name="patient_type" required>
                    <option value="DRIVER" {% if record.patient_type == "DRIVER" %}selected{% endif %}>Driver</option>
                    <option value="PASSENGER" {% if record.patient_type == "PASSENGER" %}selected{% endif %}>Passenger</option>
                    <option value="PEDESTRIAN" {% if record.patient_type == "PEDESTRIAN" %}selected{% endif %}>Pedestrian</option>
                    <option value="OTHERS" {% if record.patient_type == "OTHERS" %}selected{% endif %}>OTHERS</option>
                </select>
                <input type="text" class="form-control others-input" id="p_others" name="p_others" value="{{ record.p_others }}" placeholder="Specify other patient type">
            </div>

            <!-- Referred -->
            <div class="mb-3">
                <label class="form-label">Referred</label>
                <select class="form-select" name="v_referred" required>
                    <option value="Yes" {% if record.v_referred == "Yes" %}selected{% endif %}>Yes</option>
                    <option value="No" {% if record.v_referred == "No" %}selected{% endif %}>No</option>
                </select>
            </div>

            <!-- Facility -->
            <div class="mb-3">
                <label class="form-label">Facility</label>
                <input type="text" class="form-control" name="v_facility" value="{{ record.v_facility }}" placeholder="Facility">
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="v_status" required>
                    <option value="Recovered" {% if record.v_status == "Recovered" %}selected{% endif %}>Recovered</option>
                    <option value="Died" {% if record.v_status == "Died" %}selected{% endif %}>Died</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Handle OTHERS fields dynamically
        const vehicleSelect = document.getElementById('vehicle_type');
        const vOthers = document.getElementById('v_others');
        const patientSelect = document.getElementById('patient_type');
        const pOthers = document.getElementById('p_others');

        function toggleInput(select, input) {
            if (select.value === 'OTHERS') {
                input.style.display = 'block';
            } else {
                input.style.display = 'none';
                input.value = '';
            }
        }

        // Show initially if record value is OTHERS
        toggleInput(vehicleSelect, vOthers);
        toggleInput(patientSelect, pOthers);

        // Add event listeners
        vehicleSelect.addEventListener('change', () => toggleInput(vehicleSelect, vOthers));
        patientSelect.addEventListener('change', () => toggleInput(patientSelect, pOthers));
    </script>



</body>
</html>
